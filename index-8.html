<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WYRMLIKE — a snake roguelike</title>
<meta name="description" content="WYRMLIKE: a snake roguelike in a single HTML file. Pick a class, eat apples, roll d20s, slay the Wyrm Elder.">
<meta name="theme-color" content="#031008">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#031008;--fg:#39ff6e;--dim:#12582b;--soft:#4fbf72;--hi:#b6ffcf;--bad:#ff6b5e;--gold:#e8ff6b;--mana:#5ee0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000}
body{display:flex;justify-content:center;align-items:flex-start;padding:10px 0 24px;color:var(--fg);
  font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono","Courier New",monospace;font-size:clamp(10px,3vw,13px);font-weight:700;letter-spacing:.03em;text-shadow:0 0 6px color-mix(in srgb,var(--fg) 40%,transparent);line-height:1.6;
  background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--dim) 35%,#000),#000 70%) fixed}
#cab{width:min(96vw,520px);border:2px solid var(--dim);border-radius:10px;padding:10px;background:var(--bg);
  box-shadow:0 0 30px color-mix(in srgb,var(--fg) 18%,transparent),inset 0 0 20px #0008}
#hud .top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;color:var(--hi);margin-bottom:6px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}
.row b{width:2.6em;color:var(--fg)}
.row em{width:7.5em;text-align:right;font-style:normal;color:var(--hi)}
.bar{flex:1;height:.9em;border:1px solid var(--dim);background:#0006}
.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .15s}
#bHp i{background:var(--bad)}#bMp i{background:var(--mana)}#bXp i{background:var(--gold)}
#stats{color:var(--soft);margin-top:4px;min-height:1.6em}
#screen{position:relative;margin-top:8px;border:2px solid var(--dim);background:var(--bg);overflow:hidden;aspect-ratio:1}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#crt{position:absolute;inset:0;pointer-events:none;z-index:6;animation:flick 4s infinite;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.28) 2px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
body.nocrt #crt{display:none}
@keyframes flick{0%,100%{opacity:.9}47%{opacity:1}50%{opacity:.82}53%{opacity:1}}
@media (prefers-reduced-motion:reduce){#crt{animation:none}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;
  padding:14px;text-align:center;background:rgba(0,0,0,.84);overflow:auto;z-index:3}
#ov:empty{display:none}
#ov.compact{gap:6px;padding:10px}
#ov.compact h1{font-size:2.2em}
#ov.compact .btn{padding:5px 8px}
#ov.compact .cards{gap:5px}
#ov.compact .cards .btn{display:block}
.cls{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.cls span{color:var(--soft)}
.cards .btn small{margin-top:1px;white-space:nowrap}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov h1{margin:0;font-size:2.6em;letter-spacing:.05em;color:var(--hi);text-shadow:0 0 12px var(--fg),3px 3px 0 var(--dim)}
#ov h2{margin:0;font-size:1.8em;color:var(--hi)}
#ov h2.died{color:var(--bad);text-shadow:0 0 14px var(--bad);letter-spacing:.1em}
#ov p{margin:0;color:var(--soft)}
#ov small{color:var(--soft);display:block;margin-top:4px;line-height:1.6;font-size:.9em}
#ov pre{margin:0;font-family:inherit;color:var(--fg);line-height:1.3}
.btn{font:inherit;color:var(--fg);background:transparent;border:2px solid var(--fg);padding:8px 10px;cursor:pointer;text-align:left}
.btn:hover,.btn:focus-visible{background:var(--dim);color:var(--hi);outline:none}
.cards{display:grid;gap:8px;width:100%}
.cards .btn{width:100%}
.leg{text-align:left;display:flex;flex-direction:column;gap:5px;color:var(--soft);width:100%}
.sw{display:inline-block;width:.8em;height:.8em;margin-right:.5em;vertical-align:-1px}
.cheaton{color:var(--gold)}
.hof{color:var(--soft);font-size:.9em}.hof .me{color:var(--gold)}
#log{margin-top:8px;height:9.5em;border:1px solid var(--dim);padding:6px 8px;font-size:.9em;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end}
#log .g{color:var(--gold)}#log .b{color:var(--bad)}#log .m{color:var(--mana)}#log .n{color:var(--soft)}
#help{margin-top:8px;color:var(--soft);font-size:.85em;text-align:center;line-height:1.8}
#pad{display:none;gap:8px;margin-top:8px}
@media (pointer:coarse){#pad{display:flex}#pad .btn{flex:1;text-align:center}}
#con{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(0,0,0,.92);border-top:2px solid var(--fg);display:none;padding:6px;font-size:.9em}
#con.on{display:block}
#conOut{max-height:160px;overflow:auto;color:var(--soft);white-space:pre-wrap;word-break:break-word}
#con label{display:flex;gap:6px;color:var(--fg);margin-top:4px}
#conIn{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--hi);font:inherit;caret-color:var(--fg)}
</style>
</head>
<body>
<main id="cab">
  <section id="hud">
    <div class="top"><span id="hFloor">FLOOR 1</span><span id="hLv">LV 1</span><span id="hGold">GOLD 0</span><span id="hScore">SCORE 0</span></div>
    <div class="row"><b>HP</b><div class="bar" id="bHp"><i></i></div><em id="tHp"></em></div>
    <div class="row"><b>MP</b><div class="bar" id="bMp"><i></i></div><em id="tMp"></em></div>
    <div class="row"><b>XP</b><div class="bar" id="bXp"><i></i></div><em id="tXp"></em></div>
    <div id="stats"></div>
  </section>
  <div id="screen">
    <canvas id="c" width="480" height="480" aria-label="Game board"></canvas>
    <div id="ov"></div>
    <div id="con"><div id="conOut"></div><label>&gt;<input id="conIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Dev console"></label></div>
    <div id="crt"></div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div id="pad"><button class="btn" data-act="ability">ABILITY</button><button class="btn" data-act="pause">PAUSE</button></div>
  <div id="help">ARROWS/WASD move · SPACE ability · P pause<br>T theme · V crt · M mute · ~ console</div>
</main>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const COLS=24,ROWS=24,C=20,SIZE=COLS*C;
const cv=$('#c'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=cv.height=SIZE*DPR;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- seeded dungeon layouts: ?seed=anything ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const seedParam=new URLSearchParams(location.search).get('seed');
const seed=seedParam?hashStr(seedParam):(Math.random()*4294967296)>>>0;
const seedName=seedParam||seed.toString(36);
let rnd=Math.random;
const ri=n=>Math.floor(rnd()*n);
const d=n=>ri(n)+1;
const pick=a=>a[ri(a.length)];
const key=(x,y)=>x+','+y;
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const inb=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;

/* ---------- themes ---------- */
const THEMES=[
 {id:'phosphor',name:'PHOSPHOR',bg:'#031008',fg:'#39ff6e',dim:'#12582b',soft:'#4fbf72',hi:'#b6ffcf',bad:'#ff6b5e',gold:'#e8ff6b',mana:'#5ee0ff'},
 {id:'amber',name:'AMBER',bg:'#120900',fg:'#ffb000',dim:'#6b3f00',soft:'#c98a00',hi:'#ffe08a',bad:'#ff5a3c',gold:'#fff08a',mana:'#ffd9a0'},
 {id:'gameboy',name:'GAME BOY',bg:'#0f380f',fg:'#8bac0f',dim:'#306230',soft:'#7a9a10',hi:'#bcd85a',bad:'#f4ffc0',gold:'#9bbc0f',mana:'#9bbc0f'},
 {id:'c64',name:'C64',bg:'#352879',fg:'#a49ce8',dim:'#6c5eb5',soft:'#8f86d8',hi:'#ffffff',bad:'#ff8a8a',gold:'#eeee77',mana:'#70d4e0'}
];
let themeIdx=Math.max(0,THEMES.findIndex(t=>t.id===LS.get('wyrmlike.theme','phosphor')));
let T=THEMES[themeIdx];
function applyTheme(i){
  themeIdx=((i%THEMES.length)+THEMES.length)%THEMES.length;T=THEMES[themeIdx];
  const r=document.documentElement.style;
  for(const k of ['bg','fg','dim','soft','hi','bad','gold','mana'])r.setProperty('--'+k,T[k]);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=T.bg;
  LS.set('wyrmlike.theme',T.id);
}
let crtOn=LS.get('wyrmlike.crt',true);
function applyCrt(){document.body.classList.toggle('nocrt',!crtOn);LS.set('wyrmlike.crt',crtOn)}

/* ---------- chiptune sfx (WebAudio, no assets) ---------- */
let AC=null,muted=LS.get('wyrmlike.mute',false);
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,dur=.08,type='square',vol=.05,slide=0,delay=0){
  if(muted)return;const a=audio();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  eat:()=>{tone(520,.06);tone(780,.08,'square',.05,0,.06)},
  coin:()=>{tone(988,.05);tone(1319,.1,'square',.05,0,.05)},
  potion:()=>{tone(400,.1,'triangle',.06,300)},
  hit:()=>tone(180,.1,'sawtooth',.06,-80),
  miss:()=>tone(300,.06,'triangle',.04,-120),
  hurt:()=>tone(120,.2,'sawtooth',.08,-60),
  bump:()=>tone(90,.08,'square',.06,-30),
  kill:()=>{tone(300,.06);tone(450,.06,'square',.05,0,.06);tone(600,.1,'square',.05,0,.12)},
  level:()=>[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.09)),
  perk:()=>{tone(660,.08);tone(990,.14,'square',.05,0,.08)},
  stairs:()=>[330,262,196,131].forEach((f,i)=>tone(f,.1,'square',.05,0,i*.07)),
  spell:()=>tone(900,.25,'sawtooth',.04,-700),
  ward:()=>tone(240,.2,'triangle',.06,200),
  phase:()=>tone(200,.3,'sine',.07,600),
  deny:()=>tone(110,.1,'square',.04),
  death:()=>[262,247,233,220].forEach((f,i)=>tone(f,.3,'sawtooth',.06,-30,i*.25)),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.14,'square',.05,0,i*.11))
};
const sfx=n=>{const f=SFX[n];if(f&&!muted)f()};

/* ---------- game data ---------- */
const CLASSES={
  knight:{name:'KNIGHT',hp:14,mp:5,atk:1,ac:13,tick:140,ab:'WARD',desc:'WARD: immune for 7 ticks'},
  mage:{name:'MAGE',hp:9,mp:6,atk:2,ac:11,tick:130,ab:'FIREBALL',desc:'FIREBALL: hit first foe ahead'},
  rogue:{name:'ROGUE',hp:11,mp:5,atk:3,ac:12,tick:115,ab:'PHASE',desc:'PHASE: ghost through walls'}
};
const MON={
  slime:{g:'j',name:'Slime',col:'mana',hp:4,ac:8,atk:0,dmg:[1,1],xp:4,gold:[0,2],mv:2,ai:'wander'},
  bat:{g:'B',name:'Bat',col:'gold',hp:3,ac:11,atk:1,dmg:[1,1],xp:5,gold:[0,1],mv:1,ai:'flit'},
  skel:{g:'S',name:'Skeleton',col:'hi',hp:8,ac:12,atk:2,dmg:[1,2],xp:9,gold:[1,4],mv:2,ai:'chase'},
  archer:{g:'A',name:'Archer',col:'fg',hp:5,ac:11,atk:2,dmg:[1,2],xp:10,gold:[1,3],mv:2,ai:'shoot',tip:'Archers shoot along rows and columns. Break the line.'},
  jelly:{g:'O',name:'Jelly',col:'mana',hp:8,ac:9,atk:1,dmg:[1,1],xp:6,gold:[0,2],mv:2,ai:'wander',split:true,tip:'Jellies split into slimes when killed.'},
  ghost:{g:'G',name:'Ghost',col:'soft',hp:6,ac:13,atk:2,dmg:[1,2],xp:12,gold:[2,5],mv:2,ai:'chase',ghost:true,tip:'Ghosts glide through walls.'},
  warden:{g:'W',name:'Bone Warden',col:'gold',hp:20,ac:12,atk:2,dmg:[1,3],xp:35,gold:[8,14],mv:2,ai:'chase',boss:true},
  dragon:{g:'D',name:'Wyrm Elder',col:'bad',hp:26,ac:13,atk:3,dmg:[1,3],xp:60,gold:[15,25],mv:2,ai:'chase',boss:true}
};
const monsterPool=n=>{const p=['slime'];if(n>=2)p.push('bat');if(n>=3)p.push('skel','skel');if(n>=4)p.push('ghost','archer');if(n>=5)p.push('jelly');return p};
const PERKS=[
  {id:'vit',name:'Vitality',txt:'+3 max HP and heal 3',fn:()=>{G.hpMax+=3;heal(3)}},
  {id:'scale',name:'Iron Scales',txt:'+1 Armor Class',max:5,fn:()=>{G.ac++}},
  {id:'fang',name:'Sharp Fangs',txt:'+1 Attack (to-hit and damage)',max:6,fn:()=>{G.atk++}},
  {id:'well',name:'Arcane Well',txt:'+2 max MP and refill',fn:()=>{G.mpMax+=2;G.mp=G.mpMax}},
  {id:'hour',name:'Hourglass',txt:'Time flows 8% slower',max:3,fn:()=>{G.tickMs*=1.08}},
  {id:'midas',name:'Midas Touch',txt:'Coins are worth double',max:1,fn:()=>{G.midas*=2}},
  {id:'vamp',name:'Vampirism',txt:'Heal 1 HP on every kill',max:2,fn:()=>{G.vamp++}},
  {id:'feast',name:'Hearty Appetite',txt:'Apples restore 1 HP',max:2,fn:()=>{G.feast++}}
];
const TOMB=String.raw`  _____
 | R.I.P |
 |_~~~~_|`;

/* ---------- state ---------- */
let G=null,cheat=false,acc=0,NOW=0,lastCls=LS.get('wyrmlike.cls','knight');
const LOG=[];
const logEl=$('#log'),ovEl=$('#ov');
const ov=(html,cls='')=>{ovEl.className=cls;ovEl.innerHTML=html};
function say(msg,cls='n'){LOG.push({msg,cls});if(LOG.length>60)LOG.shift();renderLog()}
function renderLog(){
  logEl.innerHTML=LOG.slice(-6).map((l,i,a)=>`<div class="${l.cls}" style="opacity:${(.45+.55*(i+1)/a.length).toFixed(2)}">${esc(l.msg)}</div>`).join('');
}
const H={floor:$('#hFloor'),lv:$('#hLv'),gold:$('#hGold'),score:$('#hScore'),hp:$('#bHp i'),mp:$('#bMp i'),xp:$('#bXp i'),
  tHp:$('#tHp'),tMp:$('#tMp'),tXp:$('#tXp'),stats:$('#stats')};
const xpNeed=()=>8+G.level*6;
function hud(){
  H.floor.textContent='FLOOR '+G.floor;H.lv.textContent='LV '+G.level;
  H.gold.textContent='GOLD '+G.gold;H.score.textContent='SCORE '+G.score;
  H.hp.style.width=Math.max(0,G.hp/G.hpMax*100)+'%';
  H.mp.style.width=Math.max(0,G.mp/G.mpMax*100)+'%';
  H.xp.style.width=Math.min(100,G.xp/xpNeed()*100)+'%';
  H.tHp.textContent=Math.max(0,G.hp)+'/'+G.hpMax;
  H.tMp.textContent=G.mp+'/'+G.mpMax;
  H.tXp.textContent=G.xp+'/'+xpNeed();
  const st=[];if(G.ward>0)st.push('WARDED');if(G.phase>0)st.push('PHASED');if(G.god)st.push('GOD');
  const bs=G.mons.find(m=>m.def.boss),prog=bs?`${bs.def.name.toUpperCase()} ${Math.max(0,bs.hp)}/${bs.max}`:(G.stairs?'STAIRS OPEN':`APPLES ${G.applesFloor}/${appleQuota()}`);
  H.stats.textContent=`ATK +${G.atk+G.level} AC ${G.ac} ${CLASSES[G.cls].ab}[3MP] · ${prog}`+(st.length?' · '+st.join(' '):'');
}

function tip(id,msg){const t=LS.get('wyrmlike.tips',{});if(t[id])return;t[id]=1;LS.set('wyrmlike.tips',t);say('TIP: '+msg,'m')}
function setup(cls){
  const c=CLASSES[cls];
  G={state:'title',cls,floor:1,level:1,xp:0,hp:c.hp,hpMax:c.hp,mp:c.mp,mpMax:c.mp,atk:c.atk,ac:c.ac,tickMs:c.tick,
    gold:0,score:0,kills:0,apples:0,midas:1,vamp:0,feast:0,t:0,ward:0,phase:0,iframes:0,pending:0,grow:0,
    perks:{},god:cheat,tainted:cheat,runId:Date.now().toString(36)+Math.random().toString(36).slice(2,6),won:false,winQueued:false,recorded:false,shake:0,floats:[],fx:[],
    dir:{x:1,y:0},dirQ:[],snake:[],mons:[],items:[],walls:new Set(),food:null,stairs:null,
    applesFloor:0,bossFloor:false,choices:[]};
  newFloor(1);
}
function monAt(x,y){return G.mons.find(m=>m.x===x&&m.y===y)}
function isFree(x,y){
  return !G.walls.has(key(x,y))&&!G.snake.some(c=>c.x===x&&c.y===y)&&!monAt(x,y)
    &&!(G.food&&G.food.x===x&&G.food.y===y)&&!G.items.some(i=>i.x===x&&i.y===y)
    &&!(G.stairs&&G.stairs.x===x&&G.stairs.y===y);
}
function freeCell(minDist=0){
  for(let i=0;i<300;i++){
    const x=ri(COLS),y=ri(ROWS);
    if(!isFree(x,y))continue;
    const h=G.snake[0];
    if(Math.abs(x-h.x)+Math.abs(y-h.y)>=minDist)return{x,y};
  }
  return null;
}
function placeFood(){const c=freeCell(0);if(c)G.food=c}
function spawn(type,x,y){
  const def=MON[type],p=x==null?freeCell(8):{x,y};
  if(!p)return null;
  const bonus=Math.floor(G.floor/3)*(def.boss?3:1);
  const m={type,def,x:p.x,y:p.y,hp:def.hp+bonus,max:def.hp+bonus,
    ac:def.ac+(def.boss?0:Math.floor(G.floor/4)),atk:def.atk+Math.floor(G.floor/5)};
  G.mons.push(m);if(def.tip)tip(type,def.tip);return m;
}
const appleQuota=()=>Math.min(4+G.floor,12);
function floorMsg(){
  if(G.bossFloor)say(`Floor ${G.floor}: the ${(G.mons.find(m=>m.def.boss)||{def:{name:'boss'}}).def.name.toUpperCase()} stirs. Slay it to find the stairs.`,'b');
  else say(`Floor ${G.floor}: eat ${appleQuota()} apples to reveal the stairs.`,'g');
}
function newFloor(n){
  G.floor=n;G.walls=new Set();G.mons=[];G.items=[];G.stairs=null;G.food=null;G.applesFloor=0;G.fx=[];G.floats=[];
  G.bossFloor=n%5===0;
  const g=mulberry32((seed+n*7919)>>>0),gi=k=>Math.floor(g()*k);
  const nObs=Math.min(3+n*2,18);
  for(let i=0;i<nObs;i++){
    const x=gi(COLS),y=gi(ROWS),len=2+gi(4),hz=gi(2)===0;
    for(let k=0;k<len;k++){
      const cx=hz?x+k:x,cy=hz?y:y+k;
      if(inb(cx,cy)&&!(cx<=10&&cy>=9&&cy<=15))G.walls.add(key(cx,cy));
    }
  }
  rnd=mulberry32((seed+n*104729)>>>0);
  {const seen=new Set([key(8,12)]),q=[[8,12]];
   while(q.length){const [x,y]=q.pop();for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b,k=key(nx,ny);if(inb(nx,ny)&&!G.walls.has(k)&&!seen.has(k)){seen.add(k);q.push([nx,ny])}}}
   for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!seen.has(key(x,y)))G.walls.add(key(x,y));}
  const len=Math.min(7,3+Math.ceil(G.level/2));
  G.snake=[];for(let i=0;i<len;i++)G.snake.push({x:8-i,y:12});
  G.dir={x:1,y:0};G.dirQ=[];G.grow=0;G.ward=0;G.phase=0;G.iframes=2;
  placeFood();
  if(G.bossFloor){spawn(n%10===0?'dragon':'warden');spawn('skel');spawn('skel')}
  else{const cnt=Math.min(2+n,9),pool=monsterPool(n);for(let i=0;i<cnt;i++)spawn(pick(pool))}
  for(let i=0;i<2;i++){const c=freeCell();if(c)G.items.push({x:c.x,y:c.y,type:'coin',v:1+ri(3)})}
  if(n>=2&&rnd()<.6){const c=freeCell();if(c)G.items.push({x:c.x,y:c.y,type:'potion'})}
  floorMsg();
}
function startGame(cls){
  lastCls=cls;LS.set('wyrmlike.cls',cls);audio();

}
const PIX={W:'10001/10001/10001/10101/10101/11011/10001',Y:'10001/10001/01010/00100/00100/00100/00100',R:'11110/10001/10001/11110/10100/10010/10001',M:'10001/11011/10101/10101/10001/10001/10001',L:'10000/10000/10000/10000/10000/10000/11111',I:'11111/00100/00100/00100/00100/00100/11111',K:'10001/10010/10100/11000/10100/10010/10001',E:'11111/10000/10000/11110/10000/10000/11111'};

/* ---------- progression ---------- */
function heal(n){G.hp=Math.min(G.hpMax,G.hp+n);floatHead('+'+n,T.fg)}
function gainXp(n){
  G.xp+=n;let lv=false;
  while(G.xp>=xpNeed()){
    G.xp-=xpNeed();G.level++;G.pending++;G.hpMax+=1;G.hp=Math.min(G.hpMax,G.hp+2);lv=true;
    say(`LEVEL UP! You are now level ${G.level}.`,'g');
  }
  if(lv)sfx('level');
  if(G.pending>0&&G.state==='play')openPerks();
}
function openPerks(){
  G.state='levelup';
  const pool=PERKS.filter(p=>!p.max||(G.perks[p.id]||0)<p.max),ch=[];
  while(ch.length<3&&pool.length)ch.push(pool.splice(ri(pool.length),1)[0]);
  G.choices=ch;
  ov(`<h2>LEVEL ${G.level}!</h2><p>Choose a boon</p><div class="cards">${ch.map((p,i)=>
    `<button class="btn" data-act="perk:${i}"><b>${i+1}. ${p.name}</b><small>${p.txt}</small></button>`).join('')}</div>`);
}
function choosePerk(i){
  if(G.state!=='levelup')return;
  const p=G.choices[i];if(!p)return;
  p.fn();G.perks[p.id]=(G.perks[p.id]||0)+1;G.pending--;
  say(`Boon gained: ${p.name}`,'m');sfx('perk');
  if(G.pending>0)openPerks();
  else{ov('');G.state='play';acc=0;if(G.winQueued){G.winQueued=false;showWin()}}
  hud();
}

/* ---------- combat & events ---------- */
function float(x,y,txt,col){G.floats.push({x:x*C+C/2,y:y*C+4,txt,col:col||T.hi,t:0})}
function floatHead(txt,col){const h=G.snake[0];if(h)float(h.x,h.y,txt,col)}
function hurt(n,src){
  if(G.ward>0||G.god){sfx('ward');return false}
  G.hp-=n;G.shake=220;buzz(30);floatHead('-'+n,T.bad);sfx('hurt');
  if(G.hp<=0){G.hp=0;die(src)}
  return true;
}
function bump(n,what){
  n+=Math.floor(G.floor/4);sfx('bump');
  if(G.iframes>0||G.ward>0||G.god)return;
  G.iframes=3;
  say(`You slam into ${what}. -${n} HP`,'b');
  hurt(n,what);
}
function biteMonster(m){
  tip('bite','Bites roll d20+ATK+LV vs enemy AC. A natural 20 crits.');
  const roll=d(20),bonus=G.atk+G.level,tot=roll+bonus;
  const crit=roll===20,hit=crit||(roll!==1&&tot>=m.ac);
  float(m.x,Math.max(0,m.y-1),`${roll}+${bonus}`,crit?T.gold:T.soft);if(hit)G.stop=crit?170:70;
  if(!hit){
    say(`d20 ${roll}+${bonus}=${tot} vs AC ${m.ac} MISS`,'n');
    float(m.x,m.y,'miss',T.soft);sfx('miss');return;
  }
  let dmg=d(4)+G.atk;if(crit)dmg*=2;
  say(`d20 ${roll}+${bonus}=${tot} vs AC ${m.ac} ${crit?'CRIT':'HIT'} ${dmg}`,crit?'g':'n');
  damageMon(m,dmg);
}
function damageMon(m,dmg){
  m.hp-=dmg;float(m.x,m.y,'-'+dmg,T.hi);sfx('hit');
  if(m.hp<=0)kill(m);
}
function kill(m){
  const i=G.mons.indexOf(m);if(i>=0)G.mons.splice(i,1);
  G.kills++;buzz(15);G.score+=m.def.xp*10;
  G.fx.push({x:m.x,y:m.y,ch:'*',t:0,ttl:350,col:T.hi});
  sfx('kill');say(`The ${m.def.name} dies. +${m.def.xp} XP`,'g');
  const gv=m.def.gold[0]+ri(m.def.gold[1]-m.def.gold[0]+1);
  if(gv>0)G.items.push({x:m.x,y:m.y,type:'coin',v:gv});
  if(!m.def.boss&&rnd()<.15)G.items.push({x:m.x,y:m.y,type:'potion'});
  if(G.vamp)heal(G.vamp);
  if(m.def.split){let k=0;for(const [a,b] of shuffle4()){if(k>=2)break;const x=m.x+a,y=m.y+b;if(inb(x,y)&&isFree(x,y)){spawn('slime',x,y);k++}}if(k)say('The Jelly splits!','n')}
  if(m.def.boss){G.score+=500;openStairs();say(`The ${m.def.name} collapses. Stairs open below.`,'g')}
  gainXp(m.def.xp);
  if(m.def.boss&&G.floor===10&&!G.won){
    G.won=true;
    if(G.state==='play')showWin();else G.winQueued=true;
  }
}
function monsterAttack(m,seg){
  tip('hurt','Enemies can hit any segment of you. Kill them, or WARD.');
  const roll=d(20),tot=roll+m.atk,hit=roll===20||(roll!==1&&tot>=G.ac),part=seg===0?'head':'body';
  if(!hit){say(`${m.def.name} lunges at your ${part}. ${roll}+${m.atk} vs AC ${G.ac}: miss`,'n');sfx('miss');return}
  let dmg=m.def.dmg[0]+ri(m.def.dmg[1]-m.def.dmg[0]+1);if(roll===20)dmg++;
  if(G.ward>0||G.god){say(`The ${m.def.name}'s attack is ${G.god?'ignored':'warded off'}.`,'m');sfx('ward');return}
  say(`${m.def.name} bites your ${part}. ${roll}+${m.atk} vs AC ${G.ac}: ${dmg} dmg`,'b');
  hurt(dmg,'a '+m.def.name);
}
function shuffle4(){
  const a=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let i=3;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function monAct(m){
  const h=G.snake[0],dx=Math.sign(h.x-m.x),dy=Math.sign(h.y-m.y),ax=Math.abs(h.x-m.x),ay=Math.abs(h.y-m.y);
  if(m.def.ai==='shoot')for(const [sx,sy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    let x=m.x,y=m.y;
    for(let i=0;i<8;i++){x+=sx;y+=sy;if(!inb(x,y)||G.walls.has(key(x,y))||monAt(x,y))break;
      const si=G.snake.findIndex(c=>c.x===x&&c.y===y);
      if(si>=0){G.fx.push({x,y,ch:sx?'-':'|',t:0,ttl:220,col:T.bad});monsterAttack(m,si);return}}
  }
  let steps;
  if((m.def.ai==='chase'||m.def.ai==='shoot')&&ax+ay<=14&&rnd()<.85)steps=ax>=ay?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
  else if(m.def.ai==='flit')steps=shuffle4();
  else if(rnd()<.6)steps=shuffle4();
  else return;
  for(const [sx,sy] of steps){
    if(!sx&&!sy)continue;
    const nx=m.x+sx,ny=m.y+sy;
    if(!inb(nx,ny)||(G.walls.has(key(nx,ny))&&!m.def.ghost)||monAt(nx,ny))continue;
    const si=G.snake.findIndex(c=>c.x===nx&&c.y===ny);
    if(si>=0){monsterAttack(m,si);return}
    m.x=nx;m.y=ny;return;
  }
}
function openStairs(){
  tip('stairs','Step on > to descend. Floors 5 and 10 have bosses.');
  const c=freeCell(4);
  if(c){G.stairs=c;say('The stairs down appear! Reach the > to descend.','g');sfx('stairs')}
}
function eatApple(){
  tip('apple','Apples grow you and give XP. Eat the quota to open the stairs.');G.grow++;G.apples++;G.applesFloor++;G.score+=10;
  G.mp=Math.min(G.mpMax,G.mp+1);sfx('eat');floatHead('+3xp',T.gold);
  if(G.feast)heal(G.feast);
  G.food=null;placeFood();
  if(G.items.length<8){
    if(rnd()<.35){const c=freeCell();if(c)G.items.push({x:c.x,y:c.y,type:'coin',v:1+ri(3)})}
    if(rnd()<.2){const c=freeCell();if(c)G.items.push({x:c.x,y:c.y,type:'potion'})}
  }
  if(!G.bossFloor&&!G.stairs&&G.applesFloor>=appleQuota())openStairs();
  gainXp(3);
}
function applyItem(it){
  if(it.type==='coin'){
    const v=it.v*G.midas;G.gold+=v;G.score+=v*10;sfx('coin');floatHead('+'+v+'g',T.gold);
  }else{heal(4);say('You drink a potion. +4 HP','m');sfx('potion')}
}
function descend(){
  G.score+=100*G.floor;
  say(`You descend to floor ${G.floor+1} and shed your old skin.`,'g');sfx('stairs');
  heal(2);newFloor(G.floor+1);
}
function ability(){
  if(!G||G.state!=='play')return;
  if(G.mp<3){say('Not enough mana (3 MP needed).','n');sfx('deny');return}
  G.mp-=3;
  if(G.cls==='knight'){G.ward=7;sfx('ward');say('WARD! You are invulnerable for a moment.','m')}
  else if(G.cls==='rogue'){G.phase=6;sfx('phase');say('PHASE! You slip between the walls.','m')}
  else{
    sfx('spell');
    const h=G.snake[0];let x=h.x,y=h.y,hit=null;
    for(let i=0;i<7;i++){
      x+=G.dir.x;y+=G.dir.y;
      if(!inb(x,y)||G.walls.has(key(x,y)))break;
      G.fx.push({x,y,ch:'*',t:-i*25,ttl:260,col:T.bad});
      const m=monAt(x,y);if(m){hit=m;break}
    }
    if(hit){
      const dmg=d(6)+G.atk+2+Math.floor(G.level/2);
      say(`FIREBALL scorches the ${hit.def.name} for ${dmg}!`,'m');damageMon(hit,dmg);
    }else say('FIREBALL fizzles into the dark.','n');
  }
  hud();
}

/* ---------- the tick (one turn of the roguelike) ---------- */
function tick(){
  const s=G.snake;
  G.t++;
  if(G.ward>0)G.ward--;if(G.phase>0)G.phase--;if(G.iframes>0)G.iframes--;
  if(G.t%12===0&&G.mp<G.mpMax)G.mp++;
  if(G.dirQ.length)G.dir=G.dirQ.shift();
  const h=s[0],ph=G.phase>0;
  let tx=h.x+G.dir.x,ty=h.y+G.dir.y;
  if(ph){tx=(tx+COLS)%COLS;ty=(ty+ROWS)%ROWS}
  const out=!inb(tx,ty);
  const mon=out?null:monAt(tx,ty);
  if(mon){biteMonster(mon)}
  else if(!ph&&(out||G.walls.has(key(tx,ty)))){bump(1,'a dungeon wall')}
  else if(!ph&&s.some((c,i)=>i>0&&c.x===tx&&c.y===ty&&!(i===s.length-1&&G.grow===0))){bump(2,'its own tail')}
  else{
    s.unshift({x:tx,y:ty});
    if(G.grow>0)G.grow--;else s.pop();
    if(G.food&&tx===G.food.x&&ty===G.food.y)eatApple();
    for(let i=G.items.length-1;i>=0;i--){
      const it=G.items[i];
      if(it.x===tx&&it.y===ty){G.items.splice(i,1);applyItem(it)}
    }
    if(G.stairs&&tx===G.stairs.x&&ty===G.stairs.y){descend();hud();return}
  }
  if(G.state!=='play'){hud();return}
  for(const m of G.mons.slice()){
    if(G.state!=='play')break;
    if(G.mons.includes(m)&&G.t%m.def.mv===0)monAct(m);
  }
  hud();
}
function turn(dx,dy){
  const last=G.dirQ.length?G.dirQ[G.dirQ.length-1]:G.dir;
  if((dx===-last.x&&dy===-last.y)||(dx===last.x&&dy===last.y))return;
  if(G.dirQ.length<3)G.dirQ.push({x:dx,y:dy});
}

/* ---------- end states ---------- */
function copyResult(){
  const t=`WYRMLIKE ${G.cls.toUpperCase()} F${G.floor} LV${G.level} ${G.score}pts seed:${seedName}`;
  try{navigator.clipboard.writeText(t).then(()=>say('Result copied.','m'),()=>say(t,'m'))}catch(e){say(t,'m')}
}
function saveRun(){
  if(G.tainted)return -1;
  G.recorded=true;
  let hof=LS.get('wyrmlike.hof',[]).filter(r=>r.id!==G.runId);
  const rec={id:G.runId,score:G.score,cls:G.cls,floor:G.floor,lvl:G.level,date:new Date().toISOString().slice(0,10)};
  hof.push(rec);hof.sort((a,b)=>b.score-a.score);hof=hof.slice(0,5);
  LS.set('wyrmlike.hof',hof);
  return hof.indexOf(rec);
}
function die(src){
  G.state='dead';G.deadAt=NOW;buzz(200);sfx('death');

  if(G.tainted)note='<small>Cheats used. This run was not recorded.</small>';
  else if(rank>=0)note=`<small>${hadWon?'VICTORY RUN UPDATED':'NEW HALL OF FAME ENTRY'}: #${rank+1}</small>`;
  ov(`<h2 class="died">YOU DIED</h2>
<p>Killed by ${esc(src)} on floor ${G.floor}.</p>
<pre>${TOMB}</pre>
<p>SCORE ${G.score} · LV ${G.level} · ${G.kills} kills · ${G.gold} gold</p>${note}
<div class="hof">${hof.slice(0,3).map((h,i)=>`<div class="${i===rank?'me':''}">${i+1}. ${h.score} pts · ${h.cls.toUpperCase()} · F${h.floor}</div>`).join('')}</div>
<button class="btn" data-act="retry">TRY AGAIN [ENTER]</button>
<button class="btn" data-act="copy">COPY RESULT</button>
<button class="btn" data-act="title">TITLE [ESC]</button>`,'compact');
}
function showWin(){
  G.state='win';sfx('win');saveRun();hud();
  ov(`<h2>THE WYRM IS SLAIN</h2>
<p>SCORE ${G.score} · LV ${G.level} · ${G.gold} gold</p>
<small>The dungeon sighs. Deeper floors still await...</small>
<button class="btn" data-act="continue">KEEP DESCENDING [ENTER]</button>
<button class="btn" data-act="retry">NEW RUN</button>
<button class="btn" data-act="copy">COPY RESULT</button>`,'compact');

function togglePause(){

    G.state='paused';

  }else if(G.state==='paused'){G.state='play';acc=0;ov('')}

/* ---------- rendering ---------- */
function glyph(ch,x,y,size,col){
  ctx.font=`bold ${size}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(ch,x,y+1);
}
function drawWall(x,y){
  const px=x*C,py=y*C;
  ctx.fillStyle=T.dim;ctx.fillRect(px+1,py+1,C-2,C-2);
  ctx.fillStyle=T.bg;
  ctx.fillRect(px+1,py+7,C-2,1);ctx.fillRect(px+1,py+13,C-2,1);
  ctx.fillRect(px+10,py+1,1,6);ctx.fillRect(px+5,py+8,1,5);ctx.fillRect(px+15,py+8,1,5);ctx.fillRect(px+10,py+14,1,5);
}
function drawApple(x,y){
  const px=x*C,py=y*C;
  ctx.fillStyle=T.bad;
  ctx.fillRect(px+5,py+7,10,9);ctx.fillRect(px+4,py+9,12,5);ctx.fillRect(px+5,py+6,4,2);ctx.fillRect(px+11,py+6,4,2);
  ctx.fillStyle=T.fg;ctx.fillRect(px+9,py+2,2,5);ctx.fillRect(px+11,py+3,3,2);
}
function drawCoin(x,y){
  const px=x*C,py=y*C;
  ctx.fillStyle=T.gold;ctx.fillRect(px+6,py+4,8,12);ctx.fillRect(px+4,py+6,12,8);
  ctx.fillStyle=T.bg;ctx.fillRect(px+9,py+7,2,6);
}
function drawPotion(x,y){
  const px=x*C,py=y*C;
  ctx.fillStyle=T.hi;ctx.fillRect(px+8,py+3,4,4);
  ctx.fillStyle=T.mana;ctx.fillRect(px+5,py+8,10,9);ctx.fillRect(px+6,py+7,8,1);
  ctx.fillStyle=T.bg;ctx.fillRect(px+7,py+10,2,2);
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=T.bg;ctx.fillRect(0,0,SIZE,SIZE);
  if(!G)return;
  if(G.shake>0){
    G.shake-=dt;
    if(!reduceMotion)ctx.translate((Math.random()*2-1)*3,(Math.random()*2-1)*3);
  }
  ctx.fillStyle=T.dim;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)ctx.fillRect(x*C+9,y*C+9,2,2);
  for(const k of G.walls){const p=k.split(',');drawWall(+p[0],+p[1])}
  if(G.stairs){
    const px=G.stairs.x*C,py=G.stairs.y*C,on=Math.floor(NOW/300)%2;
    ctx.strokeStyle=T.hi;ctx.lineWidth=1;ctx.strokeRect(px+2.5,py+2.5,C-5,C-5);
    glyph('>',px+C/2,py+C/2,18,on?T.hi:T.fg);
  }
  if(G.food)drawApple(G.food.x,G.food.y);
  for(const it of G.items)it.type==='coin'?drawCoin(it.x,it.y):drawPotion(it.x,it.y);
  for(const m of G.mons){
    const px=m.x*C,py=m.y*C;
    glyph(m.def.g,px+C/2,py+C/2,m.def.boss?22:16,T[m.def.col]);
    if(m.hp<m.max){
      ctx.fillStyle=T.dim;ctx.fillRect(px+2,py+1,C-4,2);
      ctx.fillStyle=T.bad;ctx.fillRect(px+2,py+1,(C-4)*Math.max(0,m.hp)/m.max,2);
    }
  }
  const s=G.snake;
  ctx.globalAlpha=G.phase>0?.55:1;
  for(let i=s.length-1;i>=0;i--){
    const c=s[i],px=c.x*C,py=c.y*C;
    if(i===0){
      ctx.fillStyle=T.hi;ctx.fillRect(px+1,py+1,C-2,C-2);
      ctx.fillStyle=T.bg;
      if(G.dir.x!==0){const ex=G.dir.x>0?px+12:px+5;ctx.fillRect(ex,py+5,3,3);ctx.fillRect(ex,py+12,3,3)}
      else{const ey=G.dir.y>0?py+12:py+5;ctx.fillRect(px+5,ey,3,3);ctx.fillRect(px+12,ey,3,3)}
    }else{
      ctx.fillStyle=T.fg;ctx.fillRect(px+2,py+2,C-4,C-4);
      ctx.fillStyle=i%2?T.dim:T.soft;ctx.fillRect(px+7,py+7,6,6);
    }
  }
  ctx.globalAlpha=1;
  if(G.ward>0&&(G.ward>2||Math.floor(NOW/90)%2)){
    ctx.strokeStyle=T.mana;ctx.lineWidth=2;ctx.strokeRect(s[0].x*C-2,s[0].y*C-2,C+4,C+4);
  }
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i];f.t+=dt;
    if(f.t>=f.ttl){G.fx.splice(i,1);continue}
    if(f.t<0)continue;
    ctx.globalAlpha=1-f.t/f.ttl;glyph(f.ch,f.x*C+C/2,f.y*C+C/2,18,f.col);
  }
  for(let i=G.floats.length-1;i>=0;i--){
    const f=G.floats[i];f.t+=dt;
    if(f.t>900){G.floats.splice(i,1);continue}
    ctx.globalAlpha=1-f.t/900;glyph(f.txt,f.x,f.y-f.t*.02,10,f.col);
  }
  ctx.globalAlpha=1;
}
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(100,ts-last);last=ts;NOW=ts;
  if(G&&G.state==='play'){
    if(G.stop>0)G.stop-=dt;else acc+=dt;
    while(acc>=G.tickMs){acc-=G.tickMs;tick();if(G.state!=='play'){acc=0;break}}
  }
  render(dt);
}

/* ---------- dev console (press ~) ---------- */
const conEl=$('#con'),conOut=$('#conOut'),conIn=$('#conIn');
let conOpen=false;const hist=[];let hi=-1;
function conPrint(lines){conOut.textContent+=(conOut.textContent?'\n':'')+lines.join('\n');conOut.scrollTop=conOut.scrollHeight}
function toggleConsole(){
  conOpen=!conOpen;conEl.classList.toggle('on',conOpen);
  if(conOpen){
    if(G.state==='play')G.state='console';
    if(!conOut.textContent)conPrint(["WYRMLIKE dev console. Type 'help'."]);
    conIn.value='';setTimeout(()=>conIn.focus(),0);
  }else{
    conIn.blur();
    if(G.state==='console'){G.state='play';acc=0;if(G.pending>0)openPerks()}
  }
}
function runCmd(line){
  const parts=line.trim().split(/\s+/),c=(parts[0]||'').toLowerCase(),arg=parts.slice(1).join(' ');
  const out=[];const taint=()=>{if(!G.tainted){G.tainted=true;out.push('(run tainted: no hall of fame)')}};
  switch(c){
    case '':break;
    case 'help':
      out.push('help        this list','seed        show the dungeon seed','theme [id]  phosphor|amber|gameboy|c64','crt         toggle scanlines','mute        toggle sound','hof         hall of fame','neofetch','clear · exit','--- cheats (taint the run) ---','god · heal · gold N · xp N · floor N','spawn slime|bat|skel|dragon · kill');
      break;
    case 'seed':out.push('seed: '+seedName+'  (load the page with ?seed=anything to replay layouts)');break;
    case 'theme':{
      const i=THEMES.findIndex(t=>t.id===arg.toLowerCase().replace(/\s/g,''));
      applyTheme(i>=0?i:themeIdx+1);out.push('theme: '+T.name);break;
    }
    case 'crt':crtOn=!crtOn;applyCrt();out.push('crt '+(crtOn?'on':'off'));break;
    case 'mute':muted=!muted;LS.set('wyrmlike.mute',muted);out.push('sound '+(muted?'off':'on'));break;
    case 'hof':{const h=LS.get('wyrmlike.hof',[]);if(!h.length)out.push('(empty)');h.forEach((r,i)=>out.push(`${i+1}. ${r.score} pts  ${r.cls}  F${r.floor}  ${r.date}`));break}
    case 'neofetch':
      out.push('<@oooooo   wyrm@dungeon','           ------------','           OS: HTML5, one file','           Kernel: JavaScript','           Deps: 0','           Shell: ~ (you are in it)','           Seed: '+seedName,'           Theme: '+T.name);break;
    case 'god':taint();G.god=!G.god;out.push('god mode '+(G.god?'ON':'OFF'));hud();break;
    case 'heal':taint();G.hp=G.hpMax;G.mp=G.mpMax;out.push('restored');hud();break;
    case 'gold':{taint();const n=parseInt(arg,10)||100;G.gold+=n;out.push('+'+n+' gold');hud();break}
    case 'xp':{taint();const n=parseInt(arg,10)||10;gainXp(n);out.push('+'+n+' xp');hud();break}
    case 'floor':{taint();const n=Math.max(1,Math.min(99,parseInt(arg,10)||1));newFloor(n);out.push('warped to floor '+n);hud();break}
    case 'spawn':{
      taint();
      const t={slime:'slime',bat:'bat',skel:'skel',skeleton:'skel',dragon:'dragon',wyrm:'dragon'}[arg.toLowerCase()];
      out.push(t&&spawn(t)?'spawned '+t:'usage: spawn slime|bat|skel|dragon');break;
    }
    case 'kill':taint();[...G.mons].forEach(kill);out.push('smitten');hud();break;
    case 'clear':conOut.textContent='';return[];
    case 'exit':toggleConsole();return[];
    case 'sudo':out.push('wyrm is not in the sudoers file. This incident will be reported.');break;
    default:out.push('command not found: '+c);
  }
  return out;
}
conIn.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Escape'||e.key==='`'||e.key==='~'){e.preventDefault();toggleConsole();return}
  if(e.key==='ArrowUp'){e.preventDefault();if(hist.length){hi=Math.min(hist.length-1,hi+1);conIn.value=hist[hist.length-1-hi]}return}
  if(e.key==='ArrowDown'){e.preventDefault();hi=Math.max(-1,hi-1);conIn.value=hi<0?'':hist[hist.length-1-hi];return}
  if(e.key==='Enter'){
    const v=conIn.value;conIn.value='';hi=-1;
    if(v.trim())hist.push(v);
    conPrint(['> '+v]);
    const o=runCmd(v);if(o.length)conPrint(o);
  }
});

/* ---------- input ---------- */
const DIRS={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
const KONAMI='ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a';
let kbuf=[];
function konami(){
  cheat=true;G.god=true;G.tainted=true;sfx('level');hud();
  say('UP UP DOWN DOWN LEFT RIGHT LEFT RIGHT B A: GOD MODE. Run tainted.','m');
  if(G.state==='title')showTitle();
}
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||conOpen)return;
  const k=e.key;
  if(k==='`'||k==='~'){e.preventDefault();toggleConsole();return}
  if(e.target&&e.target.tagName==='BUTTON'&&(k==='Enter'||k===' '))return;
  kbuf.push(k.length===1?k.toLowerCase():k);if(kbuf.length>10)kbuf.shift();
  if(kbuf.join()===KONAMI){kbuf=[];konami()}
  if(k==='t'||k==='T'){applyTheme(themeIdx+1);if(G.state==='title')showTitle();return}
  if(k==='v'||k==='V'){crtOn=!crtOn;applyCrt();return}
  if(k==='m'||k==='M'){muted=!muted;LS.set('wyrmlike.mute',muted);if(!muted)sfx('coin');return}
  switch(G.state){
    case 'play':
      if(DIRS[k]){e.preventDefault();turn(DIRS[k][0],DIRS[k][1])}
      else if(k===' '){e.preventDefault();ability()}
      else if(k==='p'||k==='P'||k==='Escape')togglePause();
      break;
    case 'paused':
      if(k==='p'||k==='P'||k==='Escape'||k==='Enter'||k===' '){e.preventDefault();togglePause()}
      break;
    case 'levelup':if(/^[1-3]$/.test(k))choosePerk(+k-1);break;
    case 'title':
      if(k==='1')startGame('knight');else if(k==='2')startGame('mage');else if(k==='3')startGame('rogue');
      else if(k==='Enter')startGame(lastCls);else if(k==='h'||k==='H'||k==='?')showHelp();
      break;
    case 'dead':
      if(NOW-(G.deadAt||0)<600)break;
      if(k==='Enter'||k==='r'||k==='R')startGame(G.cls);else if(k==='Escape')showTitle();
      break;
    case 'help':showTitle();break;
    case 'win':if(k==='Enter'){G.state='play';acc=0;ov('')}break;
  }
});
function act(a){
  audio();
  const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
  switch(k){
    case 'class':startGame(v);break;
    case 'perk':choosePerk(+v);break;
    case 'retry':startGame(G.cls);break;
    case 'title':showTitle();break;
    case 'resume':togglePause();break;
    case 'continue':G.state='play';acc=0;ov('');break;
    case 'theme':applyTheme(themeIdx+1);if(G.state==='title')showTitle();break;
    case 'copy':copyResult();break;
    case 'daily':location.search='?seed='+new Date().toISOString().slice(0,10);break;
    case 'help':showHelp();break;
    case 'ability':ability();break;
    case 'pause':togglePause();break;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act]');if(b)act(b.dataset.act)});
let tx0=0,ty0=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx0=t.clientX;ty0=t.clientY;audio()},{passive:true});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
  if(Math.max(Math.abs(dx),Math.abs(dy))>22){
    if(G.state==='play'){if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy))}
    tx0=t.clientX;ty0=t.clientY;
  }
},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state==='play')togglePause()});

/* ---------- boot ---------- */
applyTheme(themeIdx);applyCrt();
showTitle();
requestAnimationFrame(loop);
window.WYRMLIKE={run:runCmd,tick,startGame,choosePerk,get G(){return G},get seed(){return seedName}};
console.log('%cWYRMLIKE','font:bold 28px monospace;color:#39ff6e;text-shadow:2px 2px #12582b');
console.log('%cPress ~ in-game for the dev console. ?seed=anything makes dungeon layouts reproducible. window.WYRMLIKE has the keys to the kingdom.','font:12px monospace;color:#4fbf72');
})();
</script>
